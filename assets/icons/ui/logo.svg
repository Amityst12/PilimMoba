      <stop offset="0%" stop-color="#192438" />
      <stop offset="70%" stop-color="#090d14" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275" />
